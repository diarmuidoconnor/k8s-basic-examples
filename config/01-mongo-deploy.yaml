apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-demo
  template:
    metadata:
      labels:
        app: mongo-demo
    spec:
      serviceAccountName: mongodb-sa
      containers:
        - image: bitnami/mongodb:latest
          name: mongo
          env:
          - name: MONGODB_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                key: password
                name: mongodb-secret
          - name: MONGODB_ROOT_USER
            valueFrom:
              configMapKeyRef:
                key: username
                name: mongodb-config
          ports:
          - containerPort: 27017
          volumeMounts:
            - name: mongo-volume
              mountPath: /bitnami/mongodb  # /data/db
            - name: mongo-test
              mountPath: /bitnami

      volumes:
        - name: mongo-volume
          persistentVolumeClaim:
             claimName: my-mongo-pvc
        - name: mongo-test
          configMap:
            name: mongodb-config
            items:
              - key: mongodb.conf
                path: test.conf
---

apiVersion: v1
kind: Service
metadata:
  name: mongo-svc-demo
spec:
  ports:
    - port: 27017
      protocol: TCP
      targetPort: 27017
      # nodePort: 32000
  selector:
    app: mongo-demo
  # type: NodePort
