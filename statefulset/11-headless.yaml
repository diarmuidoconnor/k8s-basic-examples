apiVersion: v1
kind: Service
metadata:
   name: mongo-sts-svc
spec:
   clusterIP: None     # Default
   selector:           # How to match a service to a pod(s)
      app: mongo-sts
   ports:
     - name: mongodb
       port: 27017       # Port that the service receives requests
       targetPort: 27017   # The container's port
 