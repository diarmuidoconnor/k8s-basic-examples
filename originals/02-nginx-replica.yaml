apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: nginx-replica
spec:
  replicas: 2
  selector:
     matchLabels:
        app: nginx
  template:
    metadata:
      name: nginx-pod
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx-pod1
        image: nginx:latest
        ports:
        - containerPort: 80